<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가능충 케이크</title>
<style>
:root{--bg:#fff4f7;--ink:#4a2c35;--sub:#9a6b79;--card:#ffffff;--line:#f3cfd9;--accent:#e8668a;--plate:#fffdfd;--plate-line:#ecd3da;--sponge:#f6d9a8;--cream:#fff7f0;--cream2:#ffe3ea;--shadow:rgba(120,50,70,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#241a1d;--ink:#fbe9ee;--sub:#c79aa8;--card:#33242a;--line:#5a3a45;--accent:#ff86a8;--plate:#3a2b30;--plate-line:#5d434b;--sponge:#c99a5e;--cream:#f4e6e0;--cream2:#f2b9c8;--shadow:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 14px 40px;text-align:center}
h1{margin:6px 0 2px;font-size:26px}
.sub{color:var(--sub);font-size:14px;margin:0 0 14px}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.count{color:var(--sub);font-size:13px}
#cake{position:relative;width:100%;max-width:600px;aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none}
#cake svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:15%;transform:translate(-50%,-50%) rotate(var(--r,0deg));cursor:grab;touch-action:none;filter:drop-shadow(0 3px 3px var(--shadow))}
.pin.drag{cursor:grabbing;z-index:99;filter:drop-shadow(0 8px 8px var(--shadow))}
.pin .ph{background:#fff;padding:3px;border-radius:4px;border:1px solid var(--line)}
.pin img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;pointer-events:none}
.note{color:var(--sub);font-size:12px;margin-top:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:16px;padding:14px;max-width:420px;width:100%}
#modal img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px}
#modal .row{display:flex;gap:8px;justify-content:center;margin-top:10px}
#szbox input{accent-color:var(--accent)}
#msg{color:var(--accent);font-size:13px;min-height:18px}
</style>
</head>
<body>
<main>
  <h1>🎂 가능충 케이크</h1>
  <p class="sub">내 취향인 사람(또는 캐릭터)을 케이크에 꽂아요. 모두의 사진이 실시간으로 보여요.</p>
  <div class="bar">
    <button id="add">📷 사진 꽂기</button>
    <span class="count" id="count">0개</span>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="msg"></div>
  <div id="cake">
    <svg viewBox="0 0 600 600" aria-hidden="true">
      <ellipse cx="300" cy="318" rx="292" ry="282" fill="var(--shadow)" opacity=".35"/>
      <circle cx="300" cy="300" r="292" fill="var(--plate)" stroke="var(--plate-line)" stroke-width="3"/>
      <circle cx="300" cy="300" r="262" fill="var(--sponge)"/>
      <circle cx="300" cy="300" r="250" fill="var(--cream)"/>
      <circle cx="300" cy="300" r="250" fill="none" stroke="var(--cream2)" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
      <g id="deco"></g>
      <text x="300" y="305" text-anchor="middle" font-size="26" font-weight="800" fill="var(--cream2)" opacity=".9" font-family="sans-serif">가능충 케이크</text>
    </svg>
    <div id="pins"></div>
  </div>
  <p class="note">사진을 끌어서 옮기고, 눌러서 크게 볼 수 있어요. 누구나 사진을 뺄 수 있고, 내가 올린 사진은 크기를 바꿀 수 있어요.</p>
</main>
<div id="modal"><div class="box"><img id="big" alt=""><div id="szbox" style="display:none;margin-top:10px;font-size:13px;color:var(--sub)">내 사진 크기 <input type="range" id="sz" min="8" max="30" step="1" style="vertical-align:middle;width:60%"></div><div class="row"><button class="ghost" id="close">닫기</button><button id="del" style="display:none">사진 빼기</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ▼▼▼ Firebase 콘솔에서 복사한 설정으로 교체하세요 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBffxYZ-9UK-lw1CgbGiwnVE_xwvn6wYpA",
  authDomain: "cake2-2c883.firebaseapp.com",
  projectId: "cake2-2c883",
  storageBucket: "cake2-2c883.firebasestorage.app",
  messagingSenderId: "693463597672",
  appId: "1:693463597672:web:c75398027e1fdea8ebb1dd"
};
// ▲▲▲ ─────────────────────────────────────── ▲▲▲

const cake=document.getElementById('cake'),pinsEl=document.getElementById('pins'),msg=document.getElementById('msg');
const say=t=>msg.textContent=t||'';
const deco=document.getElementById('deco'),NS='http://www.w3.org/2000/svg';
for(let i=0;i<24;i++){
  const a=i/24*Math.PI*2,cx=300+Math.cos(a)*232,cy=300+Math.sin(a)*232;
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',i%2?11:15);
  c.setAttribute('fill',i%2?'var(--cream2)':'#ef5b7b');deco.appendChild(c);
}

let db=null,myId=null,pins={},openId=null;
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function clamp(x,y){const dx=x-50,dy=y-50,max=38,d=Math.hypot(dx,dy);if(d>max){x=50+dx/d*max;y=50+dy/d*max}return [x,y]}

function render(){
  pinsEl.innerHTML='';
  const ids=Object.keys(pins).sort((a,b)=>(pins[a].ts||0)-(pins[b].ts||0));
  ids.forEach(id=>{
    const p=pins[id],d=document.createElement('div');
    d.className='pin';d.dataset.id=id;d.style.width=(p.size||15)+'%';d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.setProperty('--r',(p.rot||0)+'deg');
    const ph=document.createElement('div');ph.className='ph';
    const im=document.createElement('img');im.src=p.img;im.alt='';
    ph.appendChild(im);d.appendChild(ph);attachDrag(d,id);pinsEl.appendChild(d);
  });
  document.getElementById('count').textContent=ids.length+'개 꽂힘';
}

function attachDrag(el,id){
  let sx,sy,moved,rect,pos;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();el.setPointerCapture(e.pointerId);
    rect=cake.getBoundingClientRect();sx=e.clientX;sy=e.clientY;moved=false;pos=null;el.classList.add('drag');
  });
  el.addEventListener('pointermove',e=>{
    if(!el.hasPointerCapture(e.pointerId))return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>5)moved=true;
    if(!moved)return;
    pos=clamp((e.clientX-rect.left)/rect.width*100,(e.clientY-rect.top)/rect.height*100);
    el.style.left=pos[0]+'%';el.style.top=pos[1]+'%';
  });
  el.addEventListener('pointerup',()=>{
    el.classList.remove('drag');
    if(!moved){openBig(id);return}
    if(pos&&db){
      pins[id]={...pins[id],x:pos[0],y:pos[1]};
      updateDoc(doc(db,'pins',id),{x:pos[0],y:pos[1]}).catch(()=>say('위치 저장에 실패했어요'));
    }
  });
}

function openBig(id){
  openId=id;document.getElementById('big').src=pins[id].img;
  document.getElementById('del').style.display=db?'':'none';
  const own=!!(myId&&pins[id].by===myId),sb=document.getElementById('szbox'),sz=document.getElementById('sz');
  sb.style.display=own?'':'none';sz.value=pins[id].size||15;
  document.getElementById('modal').classList.add('on');
}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('on');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on')};
document.getElementById('del').onclick=()=>{
  if(!openId||!db)return;
  if(!confirm('이 사진을 케이크에서 뺄까요?'))return;
  deleteDoc(doc(db,'pins',openId)).catch(()=>say('삭제에 실패했어요'));
  document.getElementById('modal').classList.remove('on');
};

const szEl=document.getElementById('sz');
szEl.addEventListener('input',()=>{
  if(!openId||!pins[openId])return;
  pins[openId]={...pins[openId],size:+szEl.value};
  const el=pinsEl.querySelector('[data-id="'+openId+'"]');if(el)el.style.width=szEl.value+'%';
});
szEl.addEventListener('change',()=>{
  if(!openId||!db)return;
  updateDoc(doc(db,'pins',openId),{size:+szEl.value}).catch(()=>say('크기 저장에 실패했어요'));
});

function shrink(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const S=240,c=document.createElement('canvas');c.width=c.height=S;
      const g=c.getContext('2d'),m=Math.min(im.width,im.height);
      g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78));
    };
    im.onerror=()=>rej(new Error('img'));im.src=u;
  });
}
const fileEl=document.getElementById('file');
document.getElementById('add').onclick=()=>{
  if(!db||!myId){say('아직 연결 중이에요. 잠시 후 다시 눌러 주세요.');return}
  fileEl.click();
};
fileEl.onchange=async()=>{
  const f=fileEl.files[0];fileEl.value='';if(!f)return;
  try{
    const img=await shrink(f),ang=Math.random()*Math.PI*2,rad=Math.sqrt(Math.random())*32;
    const p={img,x:50+Math.cos(ang)*rad,y:50+Math.sin(ang)*rad,rot:Math.round(Math.random()*30-15),size:15,ts:Date.now(),by:myId};
    say('저장 중...');
    const t=setTimeout(()=>say('서버에 저장되지 않고 있어요. 네트워크(와이파이)를 확인해 주세요.'),8000);
    await setDoc(doc(db,'pins',uid()),p);clearTimeout(t);say('');
  }catch(e){say('사진을 올리지 못했어요. 잠시 후 다시 시도해 주세요.')}
};

if(firebaseConfig.apiKey==='YOUR_API_KEY'){
  say('index.html의 firebaseConfig를 내 Firebase 설정으로 바꿔 주세요.');
}else{
  const app=initializeApp(firebaseConfig),auth=getAuth(app);
  db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
  onAuthStateChanged(auth,u=>{if(u)myId=u.uid});
  signInAnonymously(auth).catch(()=>say('익명 로그인을 켜 주세요 (Firebase 콘솔 > Authentication).'));
  onSnapshot(collection(db,'pins'),snap=>{
    const n={};snap.forEach(d=>{const v=d.data();if(v&&v.img)n[d.id]=v});
    pins=n;render();
  },()=>say('연결에 실패했어요. Firestore 규칙과 설정을 확인해 주세요.'));
}
render();
</script>
</body>
</html>
